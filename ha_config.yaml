# Loads default set of integrations. Do not remove.
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_frame_options: false

rest_command:
  xr15_turn_on:
    url: "http://192.168.50.182:8765/on"
    method: GET
    timeout: 100
  xr15_turn_off:
    url: "http://192.168.50.182:8765/off"
    method: GET
    timeout: 100

input_boolean:
  xr15_state:
    name: "Radion XR15w State"
    icon: mdi:lightbulb

switch:
  - platform: template
    switches:
      radion_xr15w:
        friendly_name: "Radion XR15w G5 Pro"
        icon_template: >
          {% if is_state('input_boolean.xr15_state', 'on') %}
            mdi:led-strip-variant
          {% else %}
            mdi:led-strip-variant-off
          {% endif %}
        value_template: "{{ is_state('input_boolean.xr15_state', 'on') }}"
        turn_on:
          - service: rest_command.xr15_turn_on
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.xr15_state
        turn_off:
          - service: rest_command.xr15_turn_off
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.xr15_state
